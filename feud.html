let currentRound=0;
let roundNumber=1;
let gamePoints=0;
let strikes=0;
let found=[];
let finished=false;

const questionEl=document.getElementById("question");
const categoryEl=document.getElementById("category");
const answersEl=document.getElementById("answers");
const guessEl=document.getElementById("guess");
const messageEl=document.getElementById("message");
const nextButton=document.getElementById("next");

function normalize(text){
 return text.toLowerCase()
  .trim()
  .replace(/[.,!?']/g,"")
  .replace(/\s+/g," ");
}

function updateStats(){
 document.getElementById("gamePoints").textContent=
  gamePoints.toLocaleString();

 document.getElementById("strikes").textContent=
  strikes+" / 3";

 document.getElementById("round").textContent=
  roundNumber+" / "+rounds.length;
}

function loadRound(){
 const data=rounds[currentRound];

 found=[];
 strikes=0;
 finished=false;

 categoryEl.textContent=data.category;
 questionEl.textContent=data.question;

 guessEl.value="";
 guessEl.disabled=false;

 document.getElementById("guessButton").disabled=false;
 document.getElementById("giveup").disabled=false;

 nextButton.style.display="none";

 messageEl.textContent="Find all 10 answers!";

 updateStats();
 renderAnswers();
 guessEl.focus();
}

function renderAnswers(){
 const data=rounds[currentRound];
 answersEl.innerHTML="";

 data.answers.forEach((answer,index)=>{
  const box=document.createElement("div");
  box.className="answer";

  if(found.includes(index)||finished){
   box.classList.add("found");

   const label=document.createElement("span");
   label.textContent=(index+1)+". "+answer[0];

   const points=document.createElement("span");
   points.className="points";
   points.textContent=answer[1]+" pts";

   box.append(label,points);
  }else{
   const hidden=document.createElement("span");
   hidden.className="hidden";
   hidden.textContent=(index+1)+". ???";

   const points=document.createElement("span");
   points.className="points";
   points.textContent="???";

   box.append(hidden,points);
  }

  answersEl.appendChild(box);
 });
}

function submitGuess(){
 if(finished)return;

 const value=normalize(guessEl.value);

 if(!value)return;

 const data=rounds[currentRound];

 const index=data.answers.findIndex((answer,i)=>{
  if(found.includes(i))return false;

  const accepted=[
   answer[0],
   ...(answer[2]||[])
  ];

  return accepted.some(item=>normalize(item)===value);
 });

 if(index!==-1){
  found.push(index);

  const points=data.answers[index][1];
  gamePoints+=points;

  messageEl.textContent=
   "🎉 CORRECT! You earned "+points+" points!";

  renderAnswers();

 }else{
  strikes++;

  messageEl.textContent=
   "❌ Incorrect! Try another answer.";
 }

 guessEl.value="";
 updateStats();

 if(found.length===10){
  endRound("🏆 YOU FOUND ALL 10 ANSWERS!");
 }else if(strikes>=3){
  endRound("3 STRIKES! ROUND OVER!");
 }

 guessEl.focus();
}

function giveUp(){
 if(finished)return;

 endRound("🐶 You gave up! Here are all 10 answers.");
}

function endRound(text){
 finished=true;

 guessEl.disabled=true;

 document.getElementById("guessButton").disabled=true;
 document.getElementById("giveup").disabled=true;

 messageEl.textContent=text;

 renderAnswers();

 nextButton.style.display="inline-block";
}

function nextRound(){
 if(currentRound===rounds.length-1){
  endRound("🏆 YOU FINISHED ALL 20 ROUNDS!");
  nextButton.style.display="none";
  return;
 }

 currentRound++;
 roundNumber++;

 loadRound();
}

function restartGame(){
 currentRound=0;
 roundNumber=1;
 gamePoints=0;

 loadRound();

 messageEl.textContent="New game started! Good luck! 🐶";
}

guessEl.addEventListener("keydown",event=>{
 if(event.key==="Enter"){
  submitGuess();
 }
});

loadRound();

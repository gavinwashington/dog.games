
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dog Doin Feud</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:radial-gradient(ellipse at center,#07520b,#001000 65%,#000);
 color:white;font-family:Arial,sans-serif;text-align:center;
}
header{
 background:#000e;border-bottom:1px solid #286b20;padding:17px;
}
header a{color:#8cff65;text-decoration:none}
h1{color:#8cff65;margin:10px}
main{max-width:800px;margin:25px auto;padding:12px}
.stats{
 display:grid;grid-template-columns:repeat(2,1fr);
 gap:12px;margin-bottom:20px;
}
.stat{
 padding:17px 10px;border:1px solid #286b20;
 border-radius:13px;background:#102014;
}
.stat strong{
 display:block;color:#8cff65;font-size:27px;margin-top:7px;
}
.card{
 background:#102014;border:1px solid #286b20;
 border-radius:17px;padding:23px;margin-bottom:18px;
}
.category{color:#8cff65;font-weight:bold;letter-spacing:2px}
.question{font-size:clamp(25px,5vw,38px);font-weight:bold;margin:22px 0}
input{
 width:min(100%,450px);padding:16px;background:#061007;
 color:white;border:1px solid #58c83e;border-radius:12px;
 font-size:17px;outline:none;
}
button{
 padding:13px 20px;border:0;border-radius:10px;
 background:#8cff65;color:#102010;font-weight:bold;
 font-size:15px;cursor:pointer;margin:6px;
}
button:disabled{opacity:.4;cursor:not-allowed}
.giveup{background:#e65b5b;color:white}
.secondary{background:#263c29;color:white;border:1px solid #527c4c}
#message{min-height:26px;margin-top:14px;color:#baff9e}
#answers{
 display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;
}
.answer{
 min-height:62px;display:flex;align-items:center;
 justify-content:space-between;gap:10px;padding:12px;
 background:#17291a;border:1px solid #315c2b;
 border-radius:10px;text-align:left;
}
.answer.found{border-color:#70ff46;background:#1b3820}
.answer .points{color:#8cff65;font-weight:bold;white-space:nowrap}
.answer .hidden{color:#81917d}
#next{display:none;font-size:17px;padding:15px 30px}
.small{color:#a9c9a3;font-size:13px}
@media(max-width:500px){
 #answers{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header>
 <a href="index.html">← What The Dog Doin?</a>
 <h1>🐶 DOG DOIN FEUD</h1>
 <div>Guess the top 10 answers!</div>
</header>

<main>

 <div class="stats">
  <div class="stat">
   Lifetime Points
   <strong id="lifetime">0</strong>
  </div>
  <div class="stat">
   This Game Points
   <strong id="gamePoints">0</strong>
  </div>
  <div class="stat">
   Strikes
   <strong id="strikes">0 / 3</strong>
  </div>
  <div class="stat">
   Round
   <strong id="round">1</strong>
  </div>
 </div>

 <section class="card">
  <div class="category" id="category">ANIMALS</div>
  <div class="question" id="question">Why do cats...</div>

  <input id="guess" placeholder="Type your guess..." autocomplete="off">
  <br>

  <button id="guessButton" onclick="submitGuess()">SUBMIT GUESS</button>
  <button class="giveup" id="giveup" onclick="giveUp()">GIVE UP</button>

  <div id="message">Find all 10 answers!</div>
 </section>

 <section class="card">
  <h2>🏆 Top 10 Answers</h2>
  <p class="small">Each answer has its own point value.</p>
  <div id="answers"></div>
 </section>

 <button id="next" onclick="nextRound()">NEXT ROUND →</button>

</main>

<script>
const rounds=[
{
 category:"ANIMALS",
 question:"Why do cats...",
 answers:[
  ["sleep so much",100],
  ["purr",90],
  ["knead blankets",80],
  ["knock things over",70],
  ["hate water",60],
  ["chase lasers",50],
  ["like boxes",40],
  ["meow at night",30],
  ["stare at walls",20],
  ["have whiskers",10]
 ]
},
{
 category:"FOOD",
 question:"Why is pizza...",
 answers:[
  ["so good",100],
  ["so expensive",90],
  ["round",80],
  ["called pizza",70],
  ["so popular",60],
  ["cut into triangles",50],
  ["better cold",40],
  ["so cheesy",30],
  ["Italian",20],
  ["delicious",10]
 ]
},
{
 category:"TECHNOLOGY",
 question:"How to make a...",
 answers:[
  ["website",100],
  ["video game",90],
  ["YouTube channel",80],
  ["robot",70],
  ["Discord bot",60],
  ["computer",50],
  ["mobile app",40],
  ["logo",30],
  ["animation",20],
  ["website for free",10]
 ]
},
{
 category:"SCHOOL",
 question:"Why does school...",
 answers:[
  ["start so early",100],
  ["give homework",90],
  ["have tests",80],
  ["end so late",70],
  ["have uniforms",60],
  ["have lunch breaks",50],
  ["have summer vacation",40],
  ["have grades",30],
  ["have principals",20],
  ["have so many rules",10]
 ]
},
{
 category:"GAMING",
 question:"Why do gamers...",
 answers:[
  ["rage",100],
  ["play so much",90],
  ["like Roblox",80],
  ["need good WiFi",70],
  ["stay up late",60],
  ["buy gaming PCs",50],
  ["use headsets",40],
  ["watch streamers",30],
  ["like Minecraft",20],
  ["play with friends",10]
 ]
},
{
 category:"RANDOM",
 question:"Things you should never...",
 answers:[
  ["forget",100],
  ["say out loud",90],
  ["do at school",80],
  ["touch",70],
  ["eat",60],
  ["do when angry",50],
  ["do in public",40],
  ["put in a microwave",30],
  ["do while driving",20],
  ["do on the internet",10]
 ]
}
];

let currentRound=0;
let roundNumber=1;
let gamePoints=0;
let strikes=0;
let found=[];
let finished=false;

const STORAGE_KEY="dogDoinFeudLifetimePoints";

let lifetimePoints=Number(
 localStorage.getItem(STORAGE_KEY)||0
);

const questionEl=document.getElementById("question");
const categoryEl=document.getElementById("category");
const answersEl=document.getElementById("answers");
const guessEl=document.getElementById("guess");
const messageEl=document.getElementById("message");
const nextButton=document.getElementById("next");

function normalize(text){
 return text.toLowerCase().trim()
  .replace(/[.,!?']/g,"")
  .replace(/\s+/g," ");
}

function updateStats(){
 document.getElementById("lifetime").textContent=
  lifetimePoints.toLocaleString();

 document.getElementById("gamePoints").textContent=
  gamePoints.toLocaleString();

 document.getElementById("strikes").textContent=
  strikes+" / 3";

 document.getElementById("round").textContent=
  roundNumber;
}

function loadRound(){
 const data=rounds[currentRound];

 found=[];
 strikes=0;
 finished=false;

 categoryEl.textContent=data.category;
 questionEl.textContent=data.question;

 guessEl.value="";
 guessEl.disabled=false;

 document.getElementById("guessButton").disabled=false;
 document.getElementById("giveup").disabled=false;

 nextButton.style.display="none";
 messageEl.textContent="Find all 10 answers!";

 updateStats();
 renderAnswers();
}

function renderAnswers(){
 const data=rounds[currentRound];
 answersEl.innerHTML="";

 data.answers.forEach((answer,index)=>{
  const box=document.createElement("div");
  box.className="answer";

  if(found.includes(index)||finished){
   box.classList.add("found");

   const label=document.createElement("span");
   label.textContent=(index+1)+". "+answer[0];

   const points=document.createElement("span");
   points.className="points";
   points.textContent=answer[1]+" pts";

   box.append(label,points);
  }else{
   const hidden=document.createElement("span");
   hidden.className="hidden";
   hidden.textContent=(index+1)+". ???";

   const points=document.createElement("span");
   points.className="points";
   points.textContent="???";

   box.append(hidden,points);
  }

  answersEl.appendChild(box);
 });
}

function submitGuess(){
 if(finished)return;

 const value=normalize(guessEl.value);
 if(!value)return;

 const data=rounds[currentRound];

 const index=data.answers.findIndex((answer,i)=>
  normalize(answer[0])===value&&!found.includes(i)
 );

 if(index!==-1){
  found.push(index);

  const points=data.answers[index][1];
  gamePoints+=points;
  lifetimePoints+=points;

  localStorage.setItem(STORAGE_KEY,lifetimePoints);

  messageEl.textContent="🎉 CORRECT! You earned "+points+" points!";
  renderAnswers();
 }else{
  strikes++;
  messageEl.textContent="❌ Incorrect! Try another answer.";
 }

 guessEl.value="";
 updateStats();

 if(found.length===10){
  endRound("🏆 YOU FOUND ALL 10 ANSWERS!");
 }else if(strikes>=3){
  endRound("3 STRIKES! Round over!");
 }

 guessEl.focus();
}

function giveUp(){
 if(finished)return;
 endRound("🐶 You gave up! Here are all 10 answers.");
}

function endRound(text){
 finished=true;
 guessEl.disabled=true;
 document.getElementById("guessButton").disabled=true;
 document.getElementById("giveup").disabled=true;

 messageEl.textContent=text;
 renderAnswers();
 nextButton.style.display="inline-block";
}

function nextRound(){
 currentRound++;

 if(currentRound>=rounds.length){
  currentRound=0;
 }

 roundNumber++;
 loadRound();
}

guessEl.addEventListener("keydown",event=>{
 if(event.key==="Enter")submitGuess();
});

updateStats();
loadRound();
</script>
</body>
</html>

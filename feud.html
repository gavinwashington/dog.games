
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiwi Feud</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#071008;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}
header{
  padding:18px;
  background:#101e11;
  border-bottom:1px solid #286b20;
}
header a{color:#8cff65;text-decoration:none}
h1{color:#8cff65;margin:8px}
main{max-width:750px;margin:30px auto;padding:15px}
.card{
  background:#102014;
  border:1px solid #286b20;
  border-radius:18px;
  padding:25px;
  margin:15px 0;
}
.category{
  color:#8cff65;
  font-weight:bold;
  letter-spacing:2px;
}
.question{
  font-size:clamp(23px,5vw,36px);
  font-weight:bold;
  margin:22px 0;
}
input{
  width:min(100%,450px);
  padding:16px;
  background:#061007;
  color:white;
  border:1px solid #58c83e;
  border-radius:12px;
  font-size:17px;
  outline:none;
}
button{
  padding:14px 20px;
  border:0;
  border-radius:10px;
  background:#8cff65;
  color:#102010;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
  margin:7px;
}
button:disabled{opacity:.4;cursor:not-allowed}
.stats{
  display:flex;
  justify-content:center;
  gap:30px;
  flex-wrap:wrap;
  font-size:18px;
  margin:20px;
}
#answers{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:20px;
}
.answer{
  background:#17291a;
  border:1px solid #315c2b;
  border-radius:10px;
  min-height:60px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px;
  text-align:left;
}
.answer span:last-child{color:#8cff65;font-weight:bold}
.empty{color:#81917d}
#message{min-height:25px;color:#baff9e}
#strikes{color:#ff7777;font-size:22px}
@media(max-width:480px){
  #answers{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header>
  <a href="index.html">← Back to Kiwi</a>
  <h1>🥝 KIWI FEUD</h1>
  <div>Guess the search completions!</div>
</header>

<main>
  <div class="stats">
    <div>⭐ Score: <strong id="score">0</strong></div>
    <div>❌ Strikes: <strong id="strikes">0/3</strong></div>
    <div>🏆 Round: <strong id="round">1</strong></div>
  </div>

  <section class="card">
    <div class="category" id="category">SEARCHES</div>
    <div class="question" id="question">
      Why do cats...
    </div>

    <input id="guess" placeholder="Type your guess..." autocomplete="off">
    <br>
    <button onclick="submitGuess()">GUESS</button>
    <button onclick="skipRound()">SKIP ROUND</button>

    <div id="message"></div>
  </section>

  <section class="card">
    <h2>Top 10 Answers</h2>
    <div id="answers"></div>
  </section>

  <button onclick="nextRound()" id="next" hidden>
    NEXT ROUND →
  </button>
</main>

<script>
const rounds = [
{
 category:"ANIMALS",
 question:"Why do cats...",
 answers:[
  ["sleep so much",100],
  ["purr",90],
  ["knead blankets",80],
  ["knock things over",70],
  ["hate water",60],
  ["chase lasers",50],
  ["like boxes",40],
  ["meow at night",30],
  ["stare at walls",20],
  ["have whiskers",10]
 ]
},
{
 category:"FOOD",
 question:"Why is pizza...",
 answers:[
  ["so good",100],
  ["so expensive",90],
  ["round",80],
  ["called pizza",70],
  ["so popular",60],
  ["cut into triangles",50],
  ["better cold",40],
  ["so cheesy",30],
  ["Italian",20],
  ["delicious",10]
 ]
},
{
 category:"TECHNOLOGY",
 question:"How to make a...",
 answers:[
  ["website",100],
  ["video game",90],
  ["YouTube channel",80],
  ["robot",70],
  ["Discord bot",60],
  ["computer",50],
  ["mobile app",40],
  ["logo",30],
  ["animation",20],
  ["website for free",10]
 ]
},
{
 category:"SCHOOL",
 question:"Why does school...",
 answers:[
  ["start so early",100],
  ["give homework",90],
  ["have tests",80],
  ["end so late",70],
  ["have uniforms",60],
  ["have lunch breaks",50],
  ["have summer vacation",40],
  ["have grades",30],
  ["have principals",20],
  ["have so many rules",10]
 ]
},
{
 category:"GAMING",
 question:"Why do gamers...",
 answers:[
  ["rage",100],
  ["play so much",90],
  ["like Roblox",80],
  ["need good WiFi",70],
  ["stay up late",60],
  ["buy gaming PCs",50],
  ["use headsets",40],
  ["watch streamers",30],
  ["like Minecraft",20],
  ["play with friends",10]
 ]
},
{
 category:"RANDOM",
 question:"Things you should never...",
 answers:[
  ["forget",100],
  ["say out loud",90],
  ["do at school",80],
  ["touch",70],
  ["eat",60],
  ["do when angry",50],
  ["do in public",40],
  ["put in a microwave",30],
  ["do while driving",20],
  ["do on the internet",10]
 ]
}
];

let current=0;
let score=0;
let strikes=0;
let found=[];
let finished=false;

const question=document.getElementById("question");
const category=document.getElementById("category");
const answers=document.getElementById("answers");
const guess=document.getElementById("guess");
const message=document.getElementById("message");
const next=document.getElementById("next");

function normalize(text){
 return text.toLowerCase().trim()
 .replace(/[.,!?']/g,"")
 .replace(/\s+/g," ");
}

function loadRound(){
 const data=rounds[current%rounds.length];
 category.textContent=data.category;
 question.textContent=data.question;
 found=[];
 strikes=0;
 finished=false;
 guess.value="";
 guess.disabled=false;
 next.hidden=true;
 message.textContent="Find the 10 answers!";
 updateStats();
 renderAnswers();
 guess.focus();
}

function updateStats(){
 document.getElementById("score").textContent=score;
 document.getElementById("strikes").textContent=strikes+"/3";
 document.getElementById("round").textContent=current+1;
}

function renderAnswers(){
 const data=rounds[current%rounds.length];
 answers.innerHTML="";

 data.answers.forEach((answer,index)=>{
  const box=document.createElement("div");
  box.className="answer";

  if(found.includes(index)){
   const text=document.createElement("span");
   text.textContent=(index+1)+". "+answer[0];
   const points=document.createElement("span");
   points.textContent="+"+answer[1];
   box.append(text,points);
  }else{
   box.innerHTML='<span class="empty">'+(index+1)+'. ???</span><span>—</span>';
  }

  answers.appendChild(box);
 });
}

function submitGuess(){
 if(finished)return;

 const value=normalize(guess.value);
 if(!value)return;

 const data=rounds[current%rounds.length];

 const index=data.answers.findIndex((answer,i)=>
  normalize(answer[0])===value && !found.includes(i)
 );

 if(index!==-1){
  found.push(index);
  score+=data.answers[index][1];
  message.textContent="🎉 CORRECT! +"+data.answers[index][1]+" points!";
  renderAnswers();
 }else{
  strikes++;
  message.textContent="❌ Nope! Try another answer.";
 }

 guess.value="";
 updateStats();

 if(found.length===10){
  endRound("🏆 YOU FOUND ALL 10 ANSWERS!");
 }else if(strikes>=3){
  endRound("GAME OVER FOR THIS ROUND!");
 }

 guess.focus();
}

function endRound(text){
 finished=true;
 guess.disabled=true;
 message.textContent=text;
 next.hidden=false;
 renderAnswers();
}

function skipRound(){
 if(finished)return;
 endRound("Round skipped!");
}

function nextRound(){
 current++;
 loadRound();
}

guess.addEventListener("keydown",e=>{
 if(e.key==="Enter")submitGuess();
});

loadRound();
</script>
</body>
</html>

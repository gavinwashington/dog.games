
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="referrer" content="strict-origin-when-cross-origin">

<title>Mini Browser 2.0</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #080d08;
    color: #8cff65;
    font-family: Arial, sans-serif;
}

.browser {
    max-width: 1000px;
    margin: 30px auto;
    background: #101810;
    border: 2px solid #8cff65;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 0 20px #8cff6533;
}

.header {
    padding: 16px;
    background: #142014;
    border-bottom: 1px solid #355c35;
}

h1 {
    margin: 0 0 14px;
    font-size: 23px;
}

.toolbar {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
}

button {
    background: #1d301d;
    color: #8cff65;
    border: 1px solid #8cff65;
    border-radius: 7px;
    padding: 10px 13px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #8cff65;
    color: black;
}

.address-area {
    display: flex;
    gap: 8px;
    margin-top: 12px;
}

#address {
    flex: 1;
    min-width: 0;
    padding: 12px;
    background: #080d08;
    color: white;
    border: 1px solid #8cff65;
    border-radius: 7px;
    outline: none;
    font-size: 15px;
}

#go {
    min-width: 65px;
}

.status {
    padding: 10px 14px;
    background: #0b120b;
    color: #b4dca8;
    font-size: 13px;
    border-bottom: 1px solid #355c35;
}

.viewer {
    height: 600px;
    background: white;
}

iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
    background: white;
}

.footer {
    padding: 12px;
    text-align: center;
    font-size: 12px;
    color: #7b9975;
    background: #101810;
}

@media (max-width: 600px) {
    body {
        padding: 8px;
    }

    .browser {
        margin: 10px auto;
    }

    .viewer {
        height: 65vh;
        min-height: 350px;
    }
}
</style>
</head>

<body>

<div class="browser">

    <div class="header">

        <h1>🌐 Mini Browser 2.0</h1>

        <div class="toolbar">

            <button onclick="goBack()">←</button>
            <button onclick="goForward()">→</button>
            <button onclick="reloadPage()">⟳</button>
            <button onclick="goHome()">⌂ Home</button>

        </div>

        <div class="address-area">

            <input
                id="address"
                type="text"
                placeholder="Enter a website..."
                autocomplete="url"
                onkeydown="if(event.key === 'Enter') navigate()"
            >

            <button id="go" onclick="navigate()">Go</button>

        </div>

    </div>

    <div class="status" id="status">
        Ready. Enter a website to begin.
    </div>

    <div class="viewer">

        <iframe
            id="browserFrame"
            title="Mini Browser Website Viewer"
            referrerpolicy="strict-origin-when-cross-origin"
            allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
            allowfullscreen>
        </iframe>

    </div>

    <div class="footer">
        Mini Browser 2.0 • What The Dog Doin?
    </div>

</div>

<script>

const frame = document.getElementById("browserFrame");
const address = document.getElementById("address");
const statusText = document.getElementById("status");

let historyList = [];
let historyIndex = -1;

const HOME_PAGE = "https://example.com";

function updateStatus(message) {
    statusText.textContent = message;
}

function normalizeURL(value) {

    value = value.trim();

    if (!value) {
        return null;
    }

    if (!/^https?:\/\//i.test(value)) {
        value = "https://" + value;
    }

    try {
        const url = new URL(value);

        if (url.protocol !== "https:" &&
            url.protocol !== "http:") {
            return null;
        }

        return url;

    } catch {
        return null;
    }
}

// Convert regular YouTube video links into embed links.
function convertYouTubeURL(url) {

    const host = url.hostname.replace(/^www\./, "");

    if (
        host === "youtube.com" ||
        host === "m.youtube.com"
    ) {

        if (url.pathname === "/watch") {

            const videoID = url.searchParams.get("v");

            if (videoID) {
                return "https://www.youtube-nocookie.com/embed/" +
                    encodeURIComponent(videoID);
            }
        }

        if (url.pathname.startsWith("/shorts/")) {

            const videoID = url.pathname.split("/")[2];

            if (videoID) {
                return "https://www.youtube-nocookie.com/embed/" +
                    encodeURIComponent(videoID);
            }
        }

        if (url.pathname.startsWith("/embed/")) {
            return url.href.replace(
                "www.youtube.com",
                "www.youtube-nocookie.com"
            );
        }

        if (url.pathname === "/") {
            return null;
        }
    }

    if (host === "youtu.be") {

        const videoID = url.pathname.slice(1);

        if (videoID) {
            return "https://www.youtube-nocookie.com/embed/" +
                encodeURIComponent(videoID);
        }
    }

    return url.href;
}

function loadURL(url, addHistory = true) {

    const parsed = normalizeURL(url);

    if (!parsed) {
        updateStatus("Please enter a valid HTTP or HTTPS website.");
        return;
    }

    const finalURL = convertYouTubeURL(parsed);

    if (!finalURL) {
        updateStatus(
            "The YouTube homepage cannot be displayed here. " +
            "Try entering a specific video link."
        );
        return;
    }

    if (addHistory) {

        historyList = historyList.slice(0, historyIndex + 1);

        historyList.push(finalURL);

        historyIndex = historyList.length - 1;
    }

    address.value = parsed.href;

    frame.src = finalURL;

    updateStatus(
        "Loading: " + finalURL +
        " • Some websites block embedded viewing."
    );
}

function navigate() {
    loadURL(address.value);
}

function goBack() {

    if (historyIndex > 0) {

        historyIndex--;

        const previousURL = historyList[historyIndex];

        frame.src = previousURL;

        address.value = previousURL;

        updateStatus("Going back...");
    }
}

function goForward() {

    if (historyIndex < historyList.length - 1) {

        historyIndex++;

        const nextURL = historyList[historyIndex];

        frame.src = nextURL;

        address.value = nextURL;

        updateStatus("Going forward...");
    }
}

function reloadPage() {

    if (historyIndex >= 0) {

        frame.src = historyList[historyIndex];

        updateStatus("Reloading page...");
    }
}

function goHome() {
    loadURL(HOME_PAGE);
}

frame.addEventListener("load", function() {
    updateStatus(
        "Page finished its loading event. " +
        "If the viewer is blank, the website may block embedding."
    );
});

// Start on the homepage.
goHome();

</script>

</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wordle - What The Dog Doin?</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:radial-gradient(ellipse at center,#07520b,#001000 70%,#000);
 color:white;font-family:Arial,sans-serif;text-align:center;min-height:100vh
}
header{padding:17px;background:#000e;border-bottom:1px solid #286b20}
header a{color:#8cff65;text-decoration:none}
h1{color:#8cff65;margin:12px}
main{max-width:520px;margin:15px auto;padding:12px}
.info{color:#baff9e;font-size:14px}
#board{
 display:grid;grid-template-columns:repeat(5,1fr);
 gap:7px;width:min(330px,90vw);margin:22px auto
}
.tile{
 aspect-ratio:1;display:grid;place-items:center;
 border:2px solid #41613e;border-radius:5px;
 font-size:30px;font-weight:bold;text-transform:uppercase;
 background:#101810
}
.tile.correct{background:#398b35;border-color:#398b35}
.tile.present{background:#c29b28;border-color:#c29b28}
.tile.absent{background:#343a34;border-color:#343a34}
#keyboard{max-width:500px;margin:20px auto}
.keyrow{display:flex;justify-content:center;gap:5px;margin:6px 0}
.key{
 flex:1;max-width:43px;height:53px;border:0;border-radius:6px;
 background:#668064;color:white;font-weight:bold;font-size:15px;
 cursor:pointer;padding:3px
}
.key.wide{max-width:75px;font-size:12px}
.key.correct{background:#398b35}
.key.present{background:#c29b28}
.key.absent{background:#343a34}
button.action{
 background:#8cff65;color:#102010;border:0;border-radius:10px;
 padding:13px 22px;font-weight:bold;cursor:pointer;margin:7px
}
#message{min-height:26px;color:#baff9e;font-weight:bold}
footer{padding:20px;color:#a9c9a3;font-size:13px}
</style>
</head>
<body>

<header>
 <a href="index.html">← What The Dog Doin?</a>
 <h1>🟩 WORDLE</h1>
 <div>Guess the secret five-letter word!</div>
</header>

<main>
 <p class="info">You have 6 attempts. Green = right spot. Yellow = wrong spot.</p>

 <div id="board"></div>
 <div id="message">Good luck! 🐶</div>
 <div id="keyboard"></div>

 <button class="action" onclick="newGame()">NEW GAME</button>
</main>

<footer>What The Dog Doin? · Wordle</footer>

<script>
const words=[
 "apple","beach","black","brave","bread","brick","bring",
 "chair","chase","check","chess","child","clean","clock",
 "cloud","crane","dance","dream","drink","drive","eagle",
 "earth","flame","flash","floor","fruit","ghost","giant",
 "glass","grape","green","happy","heart","horse","house",
 "jelly","juice","light","magic","mango","money","mouse",
 "music","night","ocean","party","peace","phone","piano",
 "pizza","plane","plant","point","prize","queen","quick",
 "radio","rainy","river","robot","rocks","round","royal",
 "score","sheep","shine","shirt","shoes","short","smart",
 "smile","snake","space","spoon","sport","stars","steam",
 "stone","store","storm","table","tiger","toast","today",
 "train","truck","under","video","water","whale","wheel",
 "white","world","write","yacht","zebra"
];

let answer="";
let currentRow=0;
let currentGuess="";
let gameOver=false;
let boardStates=[];
let keyboardStates={};

const board=document.getElementById("board");
const keyboard=document.getElementById("keyboard");
const message=document.getElementById("message");

const keyRows=[
 ["Q","W","E","R","T","Y","U","I","O","P"],
 ["A","S","D","F","G","H","J","K","L"],
 ["ENTER","Z","X","C","V","B","N","M","⌫"]
];

function newGame(){
 answer=words[Math.floor(Math.random()*words.length)];
 currentRow=0;
 currentGuess="";
 gameOver=false;
 boardStates=[];
 keyboardStates={};
 message.textContent="Good luck! 🐶";
 renderBoard();
 renderKeyboard();
}

function renderBoard(){
 board.innerHTML="";

 for(let row=0;row<6;row++){
  for(let col=0;col<5;col++){
   const tile=document.createElement("div");
   tile.className="tile";

   const saved=boardStates[row]?.[col];

   if(saved){
    tile.textContent=saved.letter;
    if(saved.state)tile.classList.add(saved.state);
   }else if(row===currentRow){
    tile.textContent=currentGuess[col]||"";
   }

   board.appendChild(tile);
  }
 }
}

function renderKeyboard(){
 keyboard.innerHTML="";

 keyRows.forEach(row=>{
  const rowEl=document.createElement("div");
  rowEl.className="keyrow";

  row.forEach(letter=>{
   const key=document.createElement("button");
   key.className="key";

   if(letter==="ENTER"||letter==="⌫"){
    key.classList.add("wide");
   }

   key.textContent=letter;

   const state=keyboardStates[letter];
   if(state)key.classList.add(state);

   key.onclick=()=>{
    if(letter==="ENTER")submitGuess();
    else if(letter==="⌫")deleteLetter();
    else addLetter(letter);
   };

   rowEl.appendChild(key);
  });

  keyboard.appendChild(rowEl);
 });
}

function addLetter(letter){
 if(gameOver||currentGuess.length>=5)return;
 currentGuess+=letter.toLowerCase();
 renderBoard();
}

function deleteLetter(){
 if(gameOver)return;
 currentGuess=currentGuess.slice(0,-1);
 renderBoard();
}

function submitGuess(){
 if(gameOver)return;

 if(currentGuess.length!==5){
  message.textContent="Your guess needs 5 letters!";
  return;
 }

 if(!words.includes(currentGuess)){
  message.textContent="That word isn't in the game's word list!";
  return;
 }

 const result=[];
 const remaining=answer.split("");

 // First pass: exact matches.
 for(let i=0;i<5;i++){
  if(currentGuess[i]===answer[i]){
   result[i]="correct";
   remaining[i]=null;
  }
 }

 // Second pass: letters in the wrong position.
 for(let i=0;i<5;i++){
  if(result[i])continue;

  const found=remaining.indexOf(currentGuess[i]);

  if(found!==-1){
   result[i]="present";
   remaining[found]=null;
  }else{
   result[i]="absent";
  }
 }

 boardStates[currentRow]=[];

 for(let i=0;i<5;i++){
  boardStates[currentRow][i]={
   letter:currentGuess[i],
   state:result[i]
  };

  const letter=currentGuess[i].toUpperCase();
  const old=keyboardStates[letter];

  if(result[i]==="correct"||(!old&&result[i]==="present")||!old){
   keyboardStates[letter]=result[i];
  }
 }

 const won=currentGuess===answer;

 currentRow++;
 currentGuess="";

 renderBoard();
 renderKeyboard();

 if(won){
  gameOver=true;
  message.textContent="🎉 YOU GOT IT! The word was "+answer.toUpperCase()+"!";
 }else if(currentRow>=6){
  gameOver=true;
  message.textContent="Game over! The word was "+answer.toUpperCase()+".";
 }else{
  message.textContent="Guess "+(currentRow+1)+" of 6. Keep going!";
 }
}

document.addEventListener("keydown",event=>{
 if(event.ctrlKey||event.metaKey||event.altKey)return;

 if(event.key==="Enter"){
  submitGuess();
 }else if(event.key==="Backspace"){
  deleteLetter();
 }else if(/^[a-zA-Z]$/.test(event.key)){
  addLetter(event.key.toUpperCase());
 }
});

newGame();
</script>
</body>
</html>

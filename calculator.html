
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Calculator - What The Dog Doin?</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:radial-gradient(ellipse at center,#07520b,#001000 70%,#000);
 color:white;font-family:Arial,sans-serif;text-align:center;min-height:100vh
}
header{padding:17px;background:#000e;border-bottom:1px solid #286b20}
header a{color:#8cff65;text-decoration:none}
h1{color:#8cff65;margin:12px}
main{max-width:430px;margin:25px auto;padding:12px}
.calculator{
 background:#102014;border:1px solid #286b20;
 border-radius:18px;padding:18px;box-shadow:0 0 25px #0008
}
.display{
 background:#061007;border:1px solid #58c83e;border-radius:12px;
 min-height:100px;padding:15px;margin-bottom:15px;text-align:right;
 overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end
}
#expression{font-size:17px;color:#a9c9a3;min-height:25px;overflow-wrap:anywhere}
#result{font-size:34px;color:#8cff65;font-weight:bold;overflow-wrap:anywhere}
.buttons{
 display:grid;grid-template-columns:repeat(4,1fr);gap:9px
}
button{
 min-height:62px;border:0;border-radius:11px;
 background:#263c29;color:white;font-size:22px;
 font-weight:bold;cursor:pointer
}
button:active{transform:scale(.96)}
button.operator{background:#397d32;color:white}
button.utility{background:#53644f;color:white}
button.equals{background:#8cff65;color:#102010}
button.zero{grid-column:span 2}
#history{
 margin-top:15px;color:#a9c9a3;font-size:13px;
 min-height:20px;overflow-wrap:anywhere
}
footer{padding:20px;color:#a9c9a3;font-size:13px}
</style>
</head>
<body>

<header>
 <a href="index.html">← What The Dog Doin?</a>
 <h1>🧮 MATH CALCULATOR</h1>
 <div>Do some math!</div>
</header>

<main>
 <div class="calculator">

  <div class="display">
   <div id="expression"></div>
   <div id="result">0</div>
  </div>

  <div class="buttons">
   <button class="utility" onclick="clearAll()">AC</button>
   <button class="utility" onclick="backspace()">⌫</button>
   <button class="utility" onclick="percent()">%</button>
   <button class="operator" onclick="addOperator('/')">÷</button>

   <button onclick="addNumber('7')">7</button>
   <button onclick="addNumber('8')">8</button>
   <button onclick="addNumber('9')">9</button>
   <button class="operator" onclick="addOperator('*')">×</button>

   <button onclick="addNumber('4')">4</button>
   <button onclick="addNumber('5')">5</button>
   <button onclick="addNumber('6')">6</button>
   <button class="operator" onclick="addOperator('-')">−</button>

   <button onclick="addNumber('1')">1</button>
   <button onclick="addNumber('2')">2</button>
   <button onclick="addNumber('3')">3</button>
   <button class="operator" onclick="addOperator('+')">+</button>

   <button class="utility" onclick="addParenthesis('(')">(</button>
   <button class="utility" onclick="addParenthesis(')')">)</button>
   <button onclick="addNumber('0')">0</button>
   <button onclick="addDecimal()">.</button>

   <button class="equals" style="grid-column:span 4" onclick="calculate()">=</button>
  </div>

  <div id="history">Your calculations will appear here.</div>
 </div>
</main>

<footer>What The Dog Doin? · Math Calculator 🐶</footer>

<script>
let expression="";
let justCalculated=false;

const expressionDisplay=document.getElementById("expression");
const resultDisplay=document.getElementById("result");
const historyDisplay=document.getElementById("history");

function updateDisplay(){
 expressionDisplay.textContent=expression
  .replace(/\*/g," × ")
  .replace(/\//g," ÷ ")
  .replace(/\+/g," + ")
  .replace(/-/g," − ");

 if(!expression){
  resultDisplay.textContent="0";
  return;
 }

 try{
  const result=evaluate(expression);
  resultDisplay.textContent=formatNumber(result);
 }catch{
  resultDisplay.textContent=" ";
 }
}

function formatNumber(number){
 if(!Number.isFinite(number))return "Error";
 return Number(number.toPrecision(12)).toString();
}

function addNumber(number){
 if(justCalculated){
  expression="";
  justCalculated=false;
 }

 if(expression.endsWith(")"))expression+="*";

 expression+=number;
 updateDisplay();
}

function addDecimal(){
 if(justCalculated){
  expression="";
  justCalculated=false;
 }

 const current=expression.split(/[+\-*/()]/).pop();
 if(current.includes("."))return;

 if(!current)expression+="0";
 expression+=".";
 updateDisplay();
}

function addOperator(operator){
 justCalculated=false;

 if(!expression){
  if(operator==="-"){
   expression="-";
   updateDisplay();
  }
  return;
 }

 if(/[+\-*/.]$/.test(expression)){
  expression=expression.slice(0,-1);
 }

 expression+=operator;
 updateDisplay();
}

function addParenthesis(value){
 if(justCalculated&&value==="("){
  expression="";
 }

 justCalculated=false;
 expression+=value;
 updateDisplay();
}

function clearAll(){
 expression="";
 justCalculated=false;
 expressionDisplay.textContent="";
 resultDisplay.textContent="0";
 historyDisplay.textContent="Cleared!";
}

function backspace(){
 if(justCalculated){
  expression="";
  justCalculated=false;
 }else{
  expression=expression.slice(0,-1);
 }

 updateDisplay();
}

function percent(){
 if(!expression)return;

 const match=expression.match(/(\d*\.?\d+)$/);
 if(!match)return;

 const value=Number(match[0])/100;
 expression=expression.slice(0,-match[0].length)+String(value);
 updateDisplay();
}

// Safe arithmetic parser: no eval or Function.
function evaluate(input){
 const tokens=input.match(/\d*\.?\d+|[()+\-*/]/g);

 if(!tokens||tokens.join("")!==input.replace(/\s/g,"")){
  throw Error("Invalid expression");
 }

 let position=0;

 function parseExpression(){
  let value=parseTerm();

  while(tokens[position]==="+"||tokens[position]==="-"){
   const op=tokens[position++];
   const next=parseTerm();
   value=op==="+"?value+next:value-next;
  }

  return value;
 }

 function parseTerm(){
  let value=parseFactor();

  while(tokens[position]==="*"||tokens[position]==="/"){
   const op=tokens[position++];
   const next=parseFactor();

   if(op==="/"&&next===0)throw Error("Cannot divide by zero");

   value=op==="*"?value*next:value/next;
  }

  return value;
 }

 function parseFactor(){
  const token=tokens[position];

  if(token==="+"){
   position++;
   return parseFactor();
  }

  if(token==="-"){
   position++;
   return -parseFactor();
  }

  if(token==="("){
   position++;
   const value=parseExpression();

   if(tokens[position]!==")")throw Error("Missing closing bracket");

   position++;
   return value;
  }

  if(token===undefined||!/^(\d*\.?\d+)$/.test(token)){
   throw Error("Invalid number");
  }

  position++;
  return Number(token);
 }

 const result=parseExpression();

 if(position!==tokens.length||!Number.isFinite(result)){
  throw Error("Invalid calculation");
 }

 return result;
}

function calculate(){
 if(!expression)return;

 try{
  const original=expression;
  const result=evaluate(expression);

  expressionDisplay.textContent=
   original.replace(/\*/g," × ").replace(/\//g," ÷ ");

  resultDisplay.textContent=formatNumber(result);
  historyDisplay.textContent=
   original+" = "+formatNumber(result);

  expression=String(result);
  justCalculated=true;

 }catch(error){
  resultDisplay.textContent=
   error.message==="Cannot divide by zero"?"Cannot divide by 0":"Error";
  justCalculated=false;
 }
}

document.addEventListener("keydown",event=>{
 if(/^[0-9]$/.test(event.key)){
  addNumber(event.key);
 }else if(["+","-","*","/"].includes(event.key)){
  addOperator(event.key);
 }else if(event.key==="."){
  addDecimal();
 }else if(event.key==="Enter"||event.key==="="){
  event.preventDefault();
  calculate();
 }else if(event.key==="Backspace"){
  backspace();
 }else if(event.key==="Escape"){
  clearAll();
 }else if(event.key==="("||event.key===")"){
  addParenthesis(event.key);
 }
});

updateDisplay();
</script>

</body>
</html>
